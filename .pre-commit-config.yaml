# Pre-configuration file for pre-commit hooks
# This is optional. To run pre-commit, you need to install it and run it in the root of your repository.


exclude: \.(svg)$ # Exclude files with these extensions
default_stages: [pre-commit]
fail_fast: true                        # Stop on the first failed hook.
repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml # Check YAML files for syntax errors

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v11.1.0                                        # Version 11 as specified in contributor guide
    hooks:
      - id: clang-format
        files: \.(c|cpp|h.*)$ # hpp not suported so regex needed

  - repo: local
    hooks:
      - id: check-cmake
        name: Check CMake
        entry: ./scripts/check_cmake_format.sh
        language: script
        files: (^|/)CMakeLists\.txt$

  - repo: local  
    hooks:  
      - id: check-copyright  
        name: Check Copyright Notice  
        require_serial: true # Slower, but prevents hook from running file multiple times
        entry: ./scripts/check_copyright.sh
        language: script                
        files: \.(c|h|txt|cpp|hpp|py)$ 
        exclude: ^\.|^docs/|^examples/lulesh/|^examples/mpi/|^examples/openmp/|^external/|^cmake/

